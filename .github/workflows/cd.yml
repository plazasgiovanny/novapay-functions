name: cd

# Despliega directo a Azure (sin pasar por Terraform ni su gate de
# aprobación) al destino que esté en 0% en el backend pool ponderado de
# APIM, y avanza la rampa 5% -> 25% -> 100% con ventanas de observación
# y guardrail de error rate. ADR-01/ADR-02/ADR-03 en novapay-iac-terraform
# documentan el diseño completo; los comentarios de este archivo solo
# explican el "cómo", no el "por qué".
#
# Rollback manual: workflow_dispatch con el tag del release anterior —
# reusa exactamente el mismo mecanismo de destino/despliegue, no un
# camino aparte.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a redesplegar (rollback manual). Vacío = usar el tag del evento release."
        required: false
        type: string

permissions:
  id-token: write
  contents: read
  attestations: write

concurrency:
  group: deploy-novapay-functions-prod
  cancel-in-progress: false

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  # Usados por .github/scripts/ramp-step.sh para re-autenticar vía OIDC
  # directo si una consulta a Application Insights falla a mitad de un
  # tramo (ver HALLAZGO REAL 2026-08-18 en ese script) — el mismo
  # client-id/tenant-id que azure/login@v2 ya recibe abajo como `with:`.
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  RESOURCE_GROUP: rg-novapay-prod
  APIM_NAME: apim-novapay-prod
  APIM_GATEWAY_URL: https://apim-novapay-prod.azure-api.net
  POOL_NAME: pool-novapay-pagos-prod
  APPINSIGHTS_NAME: appi-novapay-prod
  FUNC_ESTABLE: func-novapay-pagos-prod
  FUNC_CANARY: func-novapay-pagos-canary-prod
  BACKEND_ESTABLE: func-novapay-pagos-backend
  BACKEND_CANARY: func-novapay-pagos-canary-backend
  API_VERSION: "2024-05-01"
  # Bloque 2d U4 (ADR-07): salidas de modules/observability en
  # novapay-iac-terraform (pesoactualizado_dce_logs_ingestion_endpoint,
  # pesoactualizado_dcr_immutable_id) tras el apply real — secrets del
  # repo, no valores fijos aquí (el immutable_id lo genera Azure).
  DCE_LOGS_INGESTION_ENDPOINT: ${{ secrets.DCE_LOGS_INGESTION_ENDPOINT }}
  DCR_PESOACTUALIZADO_IMMUTABLE_ID: ${{ secrets.DCR_PESOACTUALIZADO_IMMUTABLE_ID }}
  # Ruta directa de verificación en APIM (bypassa el backend pool
  # ponderado — ver HALLAZGO REAL en el step de verificación, más
  # abajo). APIM_VERIFY_KEY: salida sensible apim_verify_key de
  # novapay-iac-terraform. APIM_SUBSCRIPTION_KEY: la misma subscription
  # key ya usada para tráfico real contra el gateway.
  APIM_VERIFY_KEY: ${{ secrets.APIM_VERIFY_KEY }}
  APIM_SUBSCRIPTION_KEY: ${{ secrets.APIM_SUBSCRIPTION_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Sin esto, el subject claim del token OIDC es "ref:refs/heads/<rama>",
    # no "environment:production" — no coincide con el federated
    # credential creado en Entra ID (repo:.../environment:production) y
    # el login falla con AADSTS700213.
    environment: production
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src/NovaPay.Payments
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: dotnet publish
        run: dotnet publish --configuration Release --output ./publish

      - name: Empaquetar artefacto de despliegue
        working-directory: src/NovaPay.Payments/publish
        run: zip -r ../../../deploy.zip .

      - name: Atestación de procedencia del artefacto
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: deploy.zip

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Consultar pesos actuales del backend pool y elegir destino
        id: target
        run: |
          set -euo pipefail
          pool=$(az rest --method get \
            --uri "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.ApiManagement/service/$APIM_NAME/backends/$POOL_NAME?api-version=$API_VERSION")

          w_estable=$(echo "$pool" | jq -r --arg b "$BACKEND_ESTABLE" '.properties.pool.services[] | select(.id | endswith("/backends/" + $b)) | .weight')
          w_canary=$(echo "$pool" | jq -r --arg b "$BACKEND_CANARY" '.properties.pool.services[] | select(.id | endswith("/backends/" + $b)) | .weight')

          echo "Peso estable=$w_estable candidata=$w_canary"

          # Guardia de estado ambiguo: ninguna instancia limpiamente en
          # 0% es señal de un ciclo anterior interrumpido a mitad de
          # rampa. Se aborta y se alerta (falla el job) en vez de asumir
          # un destino.
          if [ "$w_estable" = "0" ]; then
            echo "target_app=$FUNC_ESTABLE" >> "$GITHUB_OUTPUT"
            echo "target_backend=$BACKEND_ESTABLE" >> "$GITHUB_OUTPUT"
            echo "other_backend=$BACKEND_CANARY" >> "$GITHUB_OUTPUT"
          elif [ "$w_canary" = "0" ]; then
            echo "target_app=$FUNC_CANARY" >> "$GITHUB_OUTPUT"
            echo "target_backend=$BACKEND_CANARY" >> "$GITHUB_OUTPUT"
            echo "other_backend=$BACKEND_ESTABLE" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Estado ambiguo del backend pool (estable=$w_estable, candidata=$w_canary) — ninguna instancia está limpiamente en 0%. Posible ciclo anterior interrumpido. Abortando sin desplegar."
            exit 1
          fi

      - name: Desplegar en la instancia en 0%
        run: |
          set -euo pipefail
          az functionapp deployment source config-zip \
            --src ../../deploy.zip \
            --name "${{ steps.target.outputs.target_app }}" \
            --resource-group "$RESOURCE_GROUP"

      - name: Verificación post-despliegue vía ruta directa en APIM
        # HALLAZGO REAL (primer run real de este pipeline, 2026-08-17 —
        # nunca antes ejercitado: bootstrap-deploy.yml, el único camino
        # usado hasta ahora para desplegar código, no tiene ningún paso
        # de verificación): la versión anterior de este step esperaba
        # tráfico real en la instancia recién desplegada vía Application
        # Insights, pero esa instancia SIEMPRE está al 0% de peso justo
        # después del deploy (es, por definición, la que se va a
        # promover) — con weight=0 el backend pool nunca la selecciona
        # para tráfico público. Confirmado empíricamente: 10 solicitudes
        # reales vía scripts/load-generator.sh (novapay-iac-terraform),
        # 0 llegaron a la instancia en 0%. La verificación no podía
        # pasar nunca tal como estaba diseñada.
        #
        # Fix real: la policy de APIM (novapay-iac-terraform,
        # modules/api-management) tiene una ruta directa condicional que
        # bypassa el Pool SOLO si llegan dos headers (uno con el secreto
        # APIM_VERIFY_KEY, otro con el backend-id exacto a alcanzar) —
        # sigue pasando por ip_restriction porque el origen real de la
        # solicitud sigue siendo APIM (mismo service tag ya permitido),
        # a diferencia de una invocación HTTP directa del runner contra
        # el Function App, que sí quedaría bloqueada (ADR-08).
        run: |
          set -euo pipefail
          app_id=$(az monitor app-insights component show --app "$APPINSIGHTS_NAME" -g "$RESOURCE_GROUP" --query appId -o tsv)
          role="${{ steps.target.outputs.target_app }}"
          target_backend="${{ steps.target.outputs.target_backend }}"

          fail_count=0
          for i in 1 2 3; do
            transaction_id=$(openssl rand -hex 16 | sed -E 's/(.{8})(.{4})(.{4})(.{4})(.{12})/\1-\2-\3-\4-\5/')
            body=$(printf '{"TransactionId":"%s","SourceAccount":"ACC-VERIFY-01","DestinationAccount":"ACC-VERIFY-02","Amount":1000,"Currency":"COP"}' "$transaction_id")
            http_code=$(curl -sS --max-time 30 -o /tmp/verify_resp.json -w "%{http_code}" \
              -X POST "${APIM_GATEWAY_URL}/api/v1/payments/confirmations" \
              -H "Content-Type: application/json" \
              -H "Ocp-Apim-Subscription-Key: $APIM_SUBSCRIPTION_KEY" \
              -H "X-Novapay-Verify-Key: $APIM_VERIFY_KEY" \
              -H "X-Novapay-Verify-Target: $target_backend" \
              -d "$body" || echo "000")
            echo "Verificación directa $i/3 contra $target_backend: http=$http_code"
            if [ "$http_code" != "202" ]; then
              fail_count=$((fail_count + 1))
              cat /tmp/verify_resp.json || true
            fi
            sleep 5
          done

          if [ "$fail_count" -gt 0 ]; then
            echo "::error::$fail_count de 3 solicitudes de verificación directa fallaron contra $role — no se avanza ningún peso."
            exit 1
          fi

          # Ventana corta para que la telemetría de las solicitudes de
          # arriba llegue a Application Insights antes de consultar
          # excepciones.
          sleep 60
          exceptions=$(az monitor app-insights query --app "$app_id" \
            --analytics-query "exceptions | where timestamp > ago(5m) and cloud_RoleName == '$role' | count" \
            --query "tables[0].rows[0][0]" -o tsv 2>/dev/null || echo 0)
          if [ "${exceptions:-0}" != "0" ]; then
            echo "::error::Excepciones detectadas en $role tras el despliegue — no se avanza ningún peso."
            exit 1
          fi

          echo "Verificación post-despliegue OK (3/3 solicitudes directas exitosas, sin excepciones)."

      - name: Preparar variables de la rampa
        run: |
          set -euo pipefail
          app_id=$(az monitor app-insights component show --app "$APPINSIGHTS_NAME" -g "$RESOURCE_GROUP" --query appId -o tsv)
          role="${{ steps.target.outputs.target_app }}"
          other_role="$FUNC_ESTABLE"
          if [ "$role" = "$FUNC_ESTABLE" ]; then other_role="$FUNC_CANARY"; fi
          {
            echo "APP_ID=$app_id"
            echo "ROLE=$role"
            echo "OTHER_ROLE=$other_role"
            echo "TARGET_BACKEND=${{ steps.target.outputs.target_backend }}"
            echo "OTHER_BACKEND=${{ steps.target.outputs.other_backend }}"
          } >> "$GITHUB_ENV"

      # HALLAZGO REAL (2026-08-17, primer ciclo de rampa real que corrió
      # lo suficiente para exponerlo, run 32005137531): con los 3 tramos
      # en un único step y un solo azure/login al inicio del job, el
      # ciclo completo tomó ~54 min reales — superó la vida del token
      # OIDC obtenido al inicio, y az cli no pudo renovar la assertion
      # sola a mitad de step (AADSTS700024). El pool quedó parado en
      # 25%/75% sin rollback (ese fallo no pasa por el guardrail de
      # error rate). Fix real: cada tramo en su propio step, cada uno
      # con su propio azure/login previo — token fresco por tramo, no
      # un reintento del mismo problema. Lógica compartida extraída a
      # .github/scripts/ramp-step.sh (no se puede reutilizar una función
      # de bash entre steps distintos, cada uno arranca un shell nuevo).
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Rampa a 5%
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ramp-step.sh" 5 95

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Rampa a 25%
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ramp-step.sh" 25 75

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Rampa a 100%
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ramp-step.sh" 100 0 false
